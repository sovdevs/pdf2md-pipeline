[project]
name = "pdf-to-markdown"
version = "0.1.0"
description = "SDEP — Structured Document Extraction Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "docling>=2.90.0",
    "fastapi>=0.136.0",
    "google-genai>=1.73.1",
    "pymupdf>=1.27.2.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.11",
]

[project.scripts]
pdf2md = "pdf_to_markdown.cli:main"
pdf2export = "pdf_to_markdown.export_cli:main"
pdf2extract = "pdf_to_markdown.extract_cli:main"
pdf2excel = "pdf_to_markdown.excel_cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_markdown"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
